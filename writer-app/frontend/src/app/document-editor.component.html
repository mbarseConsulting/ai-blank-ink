<main class="editor-shell">
  <header class="editor-toolbar">
    <label class="toolbar-field">
      <span class="toolbar-label">Font</span>
      <select [(ngModel)]="fontId">
        <option *ngFor="let f of fontOptions" [value]="f.id">
          {{ f.label }}
        </option>
      </select>
    </label>

    <label class="toolbar-field">
      <span class="toolbar-label">Size</span>
      <select [(ngModel)]="fontSize">
        <option *ngFor="let s of sizeOptions" [value]="s.id">
          {{ s.label }}
        </option>
      </select>
    </label>
  </header>

  <section class="editor-pane">
    <div
      #editorHost
      class="cm-editor-host"
      [ngClass]="['font-' + fontId, 'size-' + fontSize]"
    ></div>
  </section>
</main>
